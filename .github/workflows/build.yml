# Put this file at: .github/workflows/build.yml
# Then upload sctc-academy.zip to the repo root. Repo must be PUBLIC (in-app update reads GitHub Releases).
# First run creates signing/sctc.jks and commits it, so every update keeps the same signature.
# For better security later: add secrets KEYSTORE_BASE64 (alias "sctc") and KEYSTORE_PASSWORD.
name: Build SCTC APK
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'SctcAcademy2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Extract zip
        run: |
          ZIP=$(ls -t *.zip | head -n1)
          rm -rf _x app && mkdir _x
          unzip -q -o "$ZIP" -d _x && rm -rf _x/__MACOSX
          if [ "$(ls -A _x | wc -l)" = 1 ] && [ -d "_x/$(ls _x)" ]; then mv "_x/$(ls _x)" app; else mv _x app; fi
          test -f app/package.json && test -f app/www/index.html
      - name: Install and add Android
        working-directory: app
        run: |
          sed -i "s|__REPO__|$GITHUB_REPOSITORY|g" www/js/config.js
          npm install --no-audit --no-fund
          npx cap add android
          D=android/app/src/main
          cp native/*.java $D/java/bd/sctc/academy/
          mkdir -p $D/res/xml && cp native/file_paths.xml $D/res/xml/file_paths.xml
          grep -q REQUEST_INSTALL_PACKAGES $D/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' $D/AndroidManifest.xml
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          pip install -q pillow && python3 native/icons.py
      - name: Keystore
        run: |
          mkdir -p signing
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing/sctc.jks
          elif [ ! -f signing/sctc.jks ]; then
            keytool -genkeypair -keystore signing/sctc.jks -alias sctc -keyalg RSA -keysize 2048 -validity 36500 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=SCTC, O=Sabuj Computer Training Center, C=BD"
            git config user.name github-actions
            git config user.email actions@github.com
            git add signing/sctc.jks
            git commit -m "Add signing key"
            git push
          fi
      - name: Build and sign release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../../aligned.apk
          $BT/apksigner sign --ks ../../signing/sctc.jks --ks-key-alias sctc --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../../SCTC-Academy.apk ../../aligned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SCTC Academy v1.0.${{ github.run_number }}
          files: SCTC-Academy.apk
          make_latest: true
